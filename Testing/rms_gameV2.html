<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treinador de Escalonamento em Tempo Real</title>

<style>
:root{
  --bg:#1d0e08; --panel:#2c1810; --panel2:#3a2214; --line:#5a3520;
  --red:#ff3b2f; --orange:#ff9d3d; --cream:#fbefc4; --olive:#a8b04a; --muted:#c9a882; --gold:#e0b040;
  --ok:#a8b04a; --bad:#ff3b2f; --text:#fbefc4; --card:#2c1810; --acc:#ff5a36;
  --idle:#4a2a1e; --emp:#2a120c;
  color-scheme:dark;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:14px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;position:relative}
.w{max-width:820px;margin:0 auto}
.hero{position:relative;height:140px;border-radius:16px;margin-bottom:14px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(rgba(44,24,16,0.75),rgba(44,24,16,0.9)),url('Astronaut.png');background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:flex-end;padding:16px}
.hero h1{margin:0;font-size:1.5rem;color:var(--text)}
.hero p{margin:0;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.k{display:block;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.stats{display:flex;justify-content:space-around;text-align:center;gap:6px}
.stats b{display:block;font-size:1.3rem}.stats span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
button,select,input{font:inherit;font-weight:600;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
input{width:100%;text-align:center}
.tabs button{flex:1;min-width:110px}.tabs button.on,button.p,.algo button.on{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{font-size:.72rem;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px}
td{padding:5px 4px;border-top:1px solid var(--line)}
.grid-container{display:grid;grid-template-columns:repeat(auto-fill, minmax(28px, 1fr));gap:3px;padding:4px 0 8px;touch-action:none}
.slot{height:38px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.72rem;border:2px solid transparent;cursor:pointer;user-select:none}
.slot.idle{background:var(--idle);color:var(--muted)}
.slot.empty{background:var(--emp);border:2px dashed var(--line)}
.slot.m10{border-right:2px solid var(--gold)}
.tools-pal{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tool{padding:6px 12px;border-radius:8px;font-weight:800;cursor:pointer;border:2px solid var(--line);color:#fff}
.tool.sel{outline:3px solid var(--text);outline-offset:1px}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-weight:600;border:1px solid}
.fb.ok{color:var(--ok);border-color:var(--ok);background:rgba(168,176,74,0.1)}
.fb.bad{color:var(--bad);border-color:var(--bad);background:rgba(255,59,47,0.1)}
.pill{background:var(--line);padding:2px 8px;border-radius:6px;font-size:.75rem}
.pill.req{background:var(--acc);color:#fff}
.hint{font-size:.85rem;color:var(--muted);margin-top:6px}
.algo{background:var(--panel);border:1px solid var(--line);padding:10px;border-radius:10px;margin-top:8px}
.verdict-ok{color:var(--ok);font-weight:bold}
.verdict-bad{color:var(--bad);font-weight:bold}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
</style>
</head>
<body>
<div class="w">
  <div class="hero">
    <h1>RMS Scheduling Trainer</h1>
    <p>Rate Monotonic & Real-Time Scheduling</p>
  </div>

  <div class="card stats">
    <div><b id="score">0</b><span>Pontos</span></div>
    <div><b id="streak">0</b><span>Sequência</span></div>
    <div><b id="best">0</b><span>Recorde</span></div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between; margin-bottom:10px;">
      <div>
        <label class="k" for="preset">Preset / Nível:</label>
        <select id="preset" onchange="carregarPreset(this.value)"></select>
      </div>
      <div>
        <label class="k" for="H">Horizonte (H):</label>
        <input type="number" id="H" value="80" min="10" max="200" style="width:80px" onchange="definirH()">
      </div>
      <div style="align-self:flex-end">
        <button class="p" onclick="questaoAleatoria()">Gerar Aleatório</button>
      </div>
    </div>

    <div style="overflow-x:auto">
      <table id="chart"></table>
    </div>
    <div class="row" style="margin-top:10px">
      <button onclick="adicionarTarefa()">+ Tarefa</button>
      <button onclick="removerTarefa()">- Tarefa</button>
      <button onclick="validarTarefaSet()">Validar Conjunto (U & LL)</button>
    </div>
    <div id="predFb"></div>
  </div>

  <div class="tabs">
    <button class="on" onclick="mudarAba('sim')">1. Simulação</button>
    <button onclick="mudarAba('pred')">2. Previsão</button>
    <button onclick="mudarAba('des')">3. Desenho Manual</button>
    <button onclick="mudarAba('jobs')">4. Tabela de Jobs</button>
    <button onclick="mudarAba('quiz')">5. Quiz Conceitual</button>
  </div>

  <!-- ABA 1: SIMULAÇÃO / ANATOMIA -->
  <div class="card tab-pane" id="aba-sim">
    <div class="k">Anatomia Temporal das Tarefas</div>
    <div style="overflow-x:auto" id="anatomy"></div>
    <div style="margin-top:15px">
      <button onclick="mostrarSolucao()">Mostrar Soluções Completas (RM / EDF / DM)</button>
      <div id="sol"></div>
    </div>
  </div>

  <!-- ABA 2: PREVISÃO -->
  <div class="card tab-pane" id="aba-pred" style="display:none">
    <div class="k">Preveja o Comportamento dos Algoritmos</div>
    <div id="predict"></div>
    <button class="p" style="margin-top:10px" onclick="revelarPrevisao()">Conferir Previsões</button>
  </div>

  <!-- ABA 3: DESENHO MANUAL -->
  <div class="card tab-pane" id="aba-des" style="display:none">
    <div class="k">Construa o Escalonamento</div>
    <div class="row">
      <label for="drawAlgo">Algoritmo:</label>
      <select id="drawAlgo" onchange="limparDesenho()"></select>
    </div>
    <div class="tools-pal" id="tools"></div>
    <div class="grid-container" id="grid"></div>
    <div class="row" style="margin-top:10px">
      <button onclick="limparDesenho()">Limpar</button>
      <button class="p" onclick="verificarDesenho()">Verificar Desenho</button>
    </div>
    <div id="drawFb"></div>
  </div>

  <!-- ABA 4: JOBS -->
  <div class="card tab-pane" id="aba-jobs" style="display:none">
    <div class="k">Inspeção Detalhada de Jobs</div>
    <div class="row">
      <label for="jobAlgo">Algoritmo:</label>
      <select id="jobAlgo" onchange="renderizarJobs()"></select>
    </div>
    <div style="overflow-x:auto; margin-top:10px" id="jobs"></div>
  </div>

  <!-- ABA 5: QUIZ CONCEITUAL -->
  <div class="card tab-pane" id="aba-quiz" style="display:none">
    <div class="k">Desafio Rápido de Conceitos</div>
    <div id="dqBox" style="font-size:1rem; font-weight:600; margin-bottom:10px;"></div>
    <div id="dqOpts" class="opts"></div>
    <div id="dqFb"></div>
    <button class="p" style="margin-top:15px" onclick="novaDQ()">Próxima Pergunta</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const gcd=(a,b)=>b?gcd(b,a%b):a;
const lcm=(a,b)=>a/gcd(a,b)*b;
const CORES=['#e63b2e','#f08a24','#7d8b2f','#c2417a','#8c5a2b','#3f8f8b','#4b69c9','#9b4bc9'];
const ALGORITMOS={RM:'Rate Monotonic',EDF:'Earliest Deadline First',DM:'Deadline Monotonic'};

const PRESETS=[
  {t:'Questão 1', H:80, algos:['RM'], tarefas:[{p:50,d:null,c:15,pr:3},{p:40,d:null,c:10,pr:2},{p:30,d:null,c:10,pr:1}]},
  {t:'Questão 2', H:80, algos:['RM','EDF','DM'], tarefas:[{p:20,d:5,c:3,pr:1},{p:15,d:7,c:3,pr:2},{p:10,d:10,c:4,pr:3},{p:20,d:20,c:2,pr:4}]},
  {t:'Questão 3', H:80, algos:['RM','EDF','DM'], tarefas:[{p:20,d:15,c:3,pr:1},{p:15,d:17,c:3,pr:2},{p:10,d:11,c:4,pr:3},{p:20,d:20,c:2,pr:4}]},
  {t:'Nível: Easy', H:60, algos:['RM'], tarefas:[{p:10,d:null,c:2,pr:1},{p:20,d:null,c:5,pr:2}]},
  {t:'Nível: Normal', H:80, algos:['RM','EDF'], tarefas:[{p:20,d:null,c:3,pr:1},{p:15,d:null,c:3,pr:2},{p:10,d:null,c:4,pr:3}]},
  {t:'Nível: Hard', H:100, algos:['RM','EDF','DM'], tarefas:[{p:12,d:null,c:2,pr:1},{p:18,d:null,c:4,pr:2},{p:30,d:null,c:7,pr:3}]},
  {t:'Nível: Expert', H:120, algos:['RM','EDF','DM'], tarefas:[{p:10,d:null,c:3,pr:1},{p:14,d:null,c:3,pr:2},{p:20,d:null,c:5,pr:3},{p:40,d:null,c:8,pr:4}]},
  {t:'Nível: Alien', H:150, algos:['RM','EDF','DM'], tarefas:[{p:7,d:null,c:2,pr:1},{p:11,d:null,c:3,pr:2},{p:17,d:null,c:4,pr:3},{p:23,d:null,c:6,pr:4}]}
];

let tarefas=[], H=80, req=['RM'], pontuacao=0, sequencia=0, melhor=0, previsao={}, ferramenta=0, slots=[], pintando=false, solAberta=false, dq=null;
try{ melhor = +localStorage.getItem('rmsBest')||0; }catch(e){}
$('best').textContent = melhor;

function llBound(n){return n*(Math.pow(2,1/n)-1)}

function rmsSimulate(ts, horizon){
  const rem=ts.map(()=>0), slots=[], miss=[];
  for(let t=0; t<horizon; t++){
    ts.forEach((k,i)=>{if(t%k.p===0){if(rem[i]>0)miss.push({i,t});rem[i]=k.c}});
    const ready=ts.map((k,i)=>({i, rem:rem[i]})).filter(k=>k.rem>0);
    if(ready.length){
      ready.sort((a,b)=>ts[a.i].p-ts[b.i].p||a.i-b.i);
      const r=ready[0];
      rem[r.i]--;
      slots.push(r.i);
    }else{
      slots.push(-1);
    }
  }
  ts.forEach((k,i)=>{if(rem[i]>0 && horizon%k.p===0)miss.push({i,t:horizon})});
  return {slots, miss};
}

function validateTaskSet(ts){
  const n=ts.length, utilization=ts.reduce((u,t)=>u+t.c/t.p,0), bound=llBound(n);
  const horizon=Math.min(100, ts.reduce((a,k)=>lcm(a,k.p),1)||24);
  const sim=rmsSimulate(ts, horizon);
  return {valid:utilization<=1.0 && sim.miss.length===0, utilization:(utilization*100).toFixed(1), bound:(bound*100).toFixed(1), sim};
}

function D(i,algo){
  const t=tarefas[i];
  const base=t.d||t.p;
  return base;
}

function rank(algo){
  const idx=tarefas.map((_,i)=>i);
  if(algo==='DM') idx.sort((a,b)=>D(a,'DM')-D(b,'DM')||a-b);
  else idx.sort((a,b)=>tarefas[a].p-tarefas[b].p||a-b);
  const r=[]; idx.forEach((i,k)=>r[i]=k);
  return r;
}

function simular(algo){
  const jobs=[], r=rank(algo);
  let falha=null, ultimo=-1;
  const out=[];
  for(let t=0; t<=H; t++){
    for(const j of jobs) if(j.rem>0 && j.abs<=t && !falha) falha={t:j.abs, task:j.i};
    if(falha || t===H) break;

    tarefas.forEach((tk,i)=>{if(t%tk.p===0) jobs.push({i, rem:tk.c, rel:t, abs:t+(tk.d||tk.p)})});
    const ativos=jobs.filter(j=>j.rem>0);
    let escolhido=null;
    if(ativos.length){
      ativos.sort((a,b)=>{
        if(algo==='EDF') return a.abs-b.abs || a.i-b.i;
        return r[a.i]-r[b.i] || a.i-b.i;
      });
      escolhido=ativos[0];
      escolhido.rem--;
      if(escolhido.rem===0) escolhido.fim=t+1;
    }
    ultimo=escolhido?escolhido.i:-1;
    out.push(ultimo);
  }
  return {slots:out, falha, jobs};
}

function utilizacao(){return tarefas.reduce((s,t)=>s+t.c/t.p,0)}

function renderizarChart(){
  let h='<tr><th>Tarefa</th><th>Período (P)</th><th>Deadline (D)</th><th>Comp (C)</th></tr>';
  tarefas.forEach((t,i)=>{
    h+=`<tr>
      <td style="color:${CORES[i%8]};font-weight:bold">T${i+1}</td>
      <td><input type="number" min="1" value="${t.p}" onchange="editar(${i},'p',this.value)"></td>
      <td><input type="number" min="1" value="${t.d??''}" placeholder="=P" onchange="editar(${i},'d',this.value)"></td>
      <td><input type="number" min="1" value="${t.c}" onchange="editar(${i},'c',this.value)"></td>
    </tr>`;
  });
  $('chart').innerHTML=h;
}

function editar(i,k,v){
  const n=Math.round(+v);
  if(k==='p'||k==='c') tarefas[i][k]=isNaN(n)?1:Math.max(1,n);
  else if(k==='d') tarefas[i][k]=(v===''||isNaN(n))?null:Math.max(1,n);
  atualizar();
}

function adicionarTarefa(){
  if(tarefas.length>=8) return;
  tarefas.push({p:20, d:null, c:2, pr:tarefas.length+1});
  atualizar();
}

function removerTarefa(){
  if(tarefas.length>1) tarefas.pop();
  if(ferramenta>=tarefas.length) ferramenta=0;
  atualizar();
}

function definirH(){
  H=Math.max(10,Math.min(200,+($('H').value)||80));
  atualizar();
}

function validarTarefaSet(){
  const res=validateTaskSet(tarefas);
  const fbClass=res.valid?'ok':'bad';
  $('predFb').innerHTML=`<div class="fb ${fbClass}">Utilização U=${res.utilization}% (Bound LL=${res.bound}%). ${res.valid?'Conjunto viável na teoria.':'Atenção: Risco de estouro de deadline.'}</div>`;
}

function renderizarAnatomia(){
  const W=Math.min(H, Math.max(...tarefas.map(t=>t.p))*2+10), u=14, L=50, rh=32;
  let s=`<svg width="${W*u+L+10}" height="${tarefas.length*rh+25}" viewBox="0 0 ${W*u+L+10} ${tarefas.length*rh+25}">`;
  for(let t=0; t<=W; t+=5) s+=`<line x1="${L+t*u}" y1="2" x2="${L+t*u}" y2="${tarefas.length*rh}" stroke="#5a3520" stroke-width="1"/><text x="${L+t*u}" y="${tarefas.length*rh+15}" fill="#c9a882" font-size="9" text-anchor="middle">${t}</text>`;
  tarefas.forEach((t,i)=>{
    const y=i*rh+4, c=CORES[i%8];
    s+=`<text x="2" y="${y+16}" fill="${c}" font-size="11" font-weight="bold">T${i+1}</text>`;
    for(let k=0; k*t.p<W; k++){
      const r=k*t.p, x=L+r*u, dl=r+(t.d||t.p);
      s+=`<rect x="${x}" y="${y+4}" width="${t.c*u}" height="12" rx="2" fill="${c}" opacity=".85"/>`;
      if(dl<=W) s+=`<line x1="${L+dl*u}" y1="${y}" x2="${L+dl*u}" y2="${y+20}" stroke="#ff3b2f" stroke-width="1.5"/>`;
    }
  });
  $('anatomy').innerHTML=s+'</svg>';
}

function ganttSVG(res){
  const u=12, L=35, rh=24, len=H;
  let s=`<div style="overflow-x:auto"><svg width="${len*u+L+10}" height="35" style="margin-top:8px">`;
  res.slots.forEach((v,x)=>{
    if(v>=0) s+=`<rect x="${L+x*u}" y="4" width="${u-1}" height="16" rx="2" fill="${CORES[v%8]}"/>`;
    else s+=`<rect x="${L+x*u}" y="4" width="${u-1}" height="16" rx="2" fill="#4a2a1e"/>`;
  });
  for(let t=0; t<=len; t+=10) s+=`<text x="${L+t*u}" y="30" fill="#c9a882" font-size="9" text-anchor="middle">${t}</text>`;
  if(res.falha) s+=`<line x1="${L+res.falha.t*u}" y1="0" x2="${L+res.falha.t*u}" y2="30" stroke="#ff3b2f" stroke-width="2"/>`;
  s+='</svg></div>';
  return s;
}

function mostrarSolucao(){
  solAberta=!solAberta;
  renderizarSolucao();
}

function renderizarSolucao(){
  if(!solAberta){ $('sol').innerHTML=''; return; }
  $('sol').innerHTML=`<div class="hint" style="margin-top:10px">U = ${(utilizacao()*100).toFixed(1)}%</div>` +
    Object.keys(ALGORITMOS).map(a=>{
      const r=simular(a);
      const verdict=r.falha?`<span class="verdict-bad">Falha em t=${r.falha.t} (T${r.falha.task+1})</span>`:`<span class="verdict-ok">Sem falhas até t=${H}</span>`;
      return `<div class="algo"><b>${ALGORITMOS[a]}</b><br>${verdict}${ganttSVG(r)}</div>`;
    }).join('');
}

function renderizarPrevisao(){
  $('predict').innerHTML=Object.keys(ALGORITMOS).map(a=>`
    <div class="algo row" style="justify-content:space-between">
      <span><b>${ALGORITMOS[a]}</b></span>
      <span class="row">
        <button class="${previsao[a]===true?'on':''}" onclick="p('${a}',true)">Funciona</button>
        <button class="${previsao[a]===false?'on':''}" onclick="p('${a}',false)">Falha</button>
      </span>
    </div>
  `).join('');
}

function p(a,v){previsao[a]=v; renderizarPrevisao();}

function revelarPrevisao(){
  const chaves=Object.keys(ALGORITMOS);
  if(chaves.some(a=>previsao[a]===undefined)){$('predFb').innerHTML='<div class="fb bad">Responda todos os algoritmos.</div>'; return;}
  let acertos=0;
  chaves.forEach(a=>{ if((!simular(a).falha)===previsao[a]) acertos++; });
  const ok=acertos===chaves.length;
  pontuacao+=ok?20:5; sequencia=ok?sequencia+1:0;
  if(pontuacao > melhor){ melhor = pontuacao; try{localStorage.setItem('rmsBest', melhor);}catch(e){} }
  $('score').textContent=pontuacao; $('streak').textContent=sequencia; $('best').textContent=melhor;
  $('predFb').innerHTML=`<div class="fb ${ok?'ok':'bad'}">${acertos}/${chaves.length} corretos!</div>`;
}

function renderizarFerramentas(){
  let h=tarefas.map((t,i)=>`<div class="tool ${ferramenta===i?'sel':''}" style="background:${CORES[i%8]}" onclick="ferramenta=${i};renderizarFerramentas()">T${i+1}</div>`).join('');
  h+=`<div class="tool ${ferramenta===-1?'sel':''}" style="background:#4a2a1e" onclick="ferramenta=-1;renderizarFerramentas()">OCIOSO</div>`;
  $('tools').innerHTML=h;
}

function renderizarGrade(){
  $('grid').innerHTML=slots.map((v,i)=>{
    const cls=v===null?'empty':v===-1?'idle':'', st=(v!==null&&v>=0)?`style="background:${CORES[v%8]}"`:'';
    return `<div class="slot ${cls} ${i%10===9?'m10':''}" ${st} data-i="${i}" title="t=${i}">${v===null?'·':v===-1?'Ø':'T'+(v+1)}</div>`;
  }).join('');
}

function limparDesenho(){
  slots=new Array(H).fill(null);
  renderizarGrade();
  $('drawFb').innerHTML='';
}

function pintar(el){
  const s=el&&el.closest&&el.closest('.slot');
  if(!s) return;
  const i=+s.dataset.i;
  if(slots[i]!==ferramenta){ slots[i]=ferramenta; renderizarGrade(); }
}

$('grid').addEventListener('pointerdown',e=>{pintando=true;try{e.target.releasePointerCapture(e.pointerId);}catch(_){}pintar(e.target);e.preventDefault();});
$('grid').addEventListener('pointermove',e=>{if(pintando)pintar(document.elementFromPoint(e.clientX,e.clientY));});
window.addEventListener('pointerup',()=>pintando=false);

function verificarDesenho(){
  const a=$('drawAlgo').value, r=simular(a), lim=r.slots.length;
  for(let i=0; i<lim; i++){
    const meu=slots[i]===null?-1:slots[i];
    if(meu!==r.slots[i]){
      $('drawFb').innerHTML=`<div class="fb bad">Diferença em t=${i}: Esperado ${r.slots[i]===-1?'OCIOSO':'T'+(r.slots[i]+1)}, colocado ${meu===-1?'OCIOSO':'T'+(meu+1)}.</div>`;
      return;
    }
  }
  $('drawFb').innerHTML=`<div class="fb ok">Parabéns! Escalonamento correto${r.falha?` até a falha em t=${r.falha.t} (T${r.falha.task+1} perde o deadline)`:` até t=${H}`}.</div>`;
}

function renderizarJobs(){
  const a=$('jobAlgo').value, r=simular(a);
  let h='<table><tr><th>Job</th><th>Rel</th><th>Abs</th><th>Fim</th><th>Resp</th><th>Folga</th><th>Status</th></tr>';
  r.jobs.slice(0,35).forEach((j,idx)=>{
    const feito=j.fim!==undefined, ok=feito&&j.fim<=j.abs;
    const resp = feito ? (j.fim - j.rel) : '-';
    const folga = feito ? (j.abs - j.fim) : '-';
    const perdido = !ok && (feito || (r.falha && j.abs<=r.falha.t));
    const st = ok ? '<span class="verdict-ok">OK</span>' : perdido ? '<span class="verdict-bad">Perdido</span>' : '<span class="pill">Pendente</span>';
    h+=`<tr><td style="color:${CORES[j.i%8]};font-weight:bold">T${j.i+1}</td><td>${j.rel}</td><td>${j.abs}</td><td>${feito?j.fim:'-'}</td><td>${resp}</td><td>${folga}</td><td>${st}</td></tr>`;
  });
  $('jobs').innerHTML=h+'</table>';
}

function novaDQ(){
  const n=tarefas.length;
  const distinto=new Set(tarefas.map(t=>t.p)).size>1;
  const type=(n<2||!distinto)?0:rnd(0,1);
  const dd=i=>tarefas[i].d||tarefas[i].p;
  if(type===0){
    const i=rnd(0,n-1), k=rnd(0,2), t=tarefas[i];
    const ans=k*t.p + dd(i);
    const opts=[...new Set([ans, (k+1)*t.p + dd(i), k*t.p + t.p, dd(i)])];
    let extra=1;
    while(opts.length<4){ const c=ans+extra++; if(!opts.includes(c)) opts.push(c); }
    dq={
      ans,
      txt: `T${i+1} tem período ${t.p} e deadline relativo ${dd(i)}. Qual o deadline absoluto do job liberado em t=${k*t.p}?`,
      options: opts,
      task:false,
      done:false
    };
  }else{
    let i,j;
    do{ i=rnd(0,n-1); j=rnd(0,n-1); }while(i===j||tarefas[i].p===tarefas[j].p);
    dq={
      ans: tarefas[i].p < tarefas[j].p ? i : j,
      txt: `No Rate Monotonic, qual tem prioridade maior: T${i+1} (P=${tarefas[i].p}) ou T${j+1} (P=${tarefas[j].p})?`,
      options: [i, j],
      task:true,
      done:false
    };
  }
  $('dqBox').textContent = dq.txt;
  const shuffled = [...dq.options].sort(()=>Math.random()-0.5);
  $('dqOpts').innerHTML = shuffled.map(opt=>{
    const label = dq.task ? `T${opt+1}` : opt;
    return `<button onclick="responderDQ(${opt})">${label}</button>`;
  }).join('');
  $('dqFb').innerHTML = '';
}

function responderDQ(val){
  if(!dq || dq.done) return;
  dq.done=true;
  const acertou = val === dq.ans;
  if(acertou){ pontuacao+=10; sequencia++; } else { sequencia=0; }
  if(pontuacao > melhor){ melhor = pontuacao; try{localStorage.setItem('rmsBest', melhor);}catch(e){} }
  $('score').textContent=pontuacao; $('streak').textContent=sequencia; $('best').textContent=melhor;
  $('dqFb').innerHTML = `<div class="fb ${acertou?'ok':'bad'}">${acertou?'Correto!':'Incorreto. Resposta: '+(dq.task?'T'+(dq.ans+1):dq.ans)+'.'}</div>`;
}

function carregarPreset(i){
  const p=PRESETS[i]||PRESETS[0];
  tarefas=p.tarefas.map(t=>({...t}));
  H=p.H; req=p.algos;
  $('H').value=H; $('preset').value=i;
  atualizar(true);
}

function questaoAleatoria(){
  const idx=+$('preset').value||0;
  const nivel=idx>=3?idx-3:1;
  const cfg=[
    {n:2,pool:[6,8,10,12,15,20],u:[.4,.7],h:60,dl:false},
    {n:3,pool:[8,10,12,15,20,24],u:[.6,.85],h:80,dl:false},
    {n:3,pool:[10,12,15,18,20,30],u:[.8,.95],h:100,dl:true},
    {n:4,pool:[10,12,14,15,20,24,30,40],u:[.8,.98],h:120,dl:true},
    {n:4,pool:[7,9,11,13,17,19,23],u:[.9,1],h:150,dl:true}
  ][nivel];
  let ts=[];
  for(let tent=0; tent<500; tent++){
    const ps=[...cfg.pool].sort(()=>Math.random()-0.5).slice(0,cfg.n).sort((a,b)=>a-b);
    ts=ps.map((p,i)=>{
      const c=rnd(1,Math.max(1,Math.floor(p*0.4)));
      let d=null;
      if(cfg.dl && Math.random()<0.6){
        const dv=rnd(Math.max(c,Math.ceil(p*0.6)),p);
        d=dv<p?dv:null;
      }
      return {p,d,c,pr:i+1};
    });
    const u=ts.reduce((s,t)=>s+t.c/t.p,0);
    if(u>=cfg.u[0] && u<=cfg.u[1]) break;
  }
  tarefas=ts;
  H=cfg.h; $('H').value=H;
  atualizar(true);
}

function atualizar(reset=false){
  renderizarChart();
  renderizarAnatomia();
  renderizarPrevisao();
  renderizarFerramentas();
  if(reset || slots.length!==H) limparDesenho();
  else renderizarGrade();
  renderizarJobs();
  if(solAberta) renderizarSolucao();
  if(reset) novaDQ();
}

function mudarAba(aba){
  document.querySelectorAll('.tab-pane').forEach(el=>el.style.display='none');
  document.querySelectorAll('.tabs button').forEach(el=>el.classList.remove('on'));
  $(`aba-${aba}`).style.display='block';
  event.target.classList.add('on');
}

// Inicialização
$('drawAlgo').innerHTML=Object.keys(ALGORITMOS).map(a=>`<option value="${a}">${ALGORITMOS[a]}</option>`).join('');
$('jobAlgo').innerHTML=Object.keys(ALGORITMOS).map(a=>`<option value="${a}">${ALGORITMOS[a]}</option>`).join('');
$('preset').innerHTML=PRESETS.map((p,i)=>`<option value="${i}">${p.t}</option>`).join('');
carregarPreset(0);
